name: Mod inbox

# Every day, add new mods from the community catalogue to data/inbox.json
# and refresh the stars and dates of the ones already there.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inbox.py
      - name: Commit the inbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/inbox.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh the mod inbox"
          git push
